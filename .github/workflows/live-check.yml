name: Live check

# After each push to main: wait until the live site serves this exact commit,
# then open the key pages at phone size. A red run means the deploy didn't
# go live or something is broken on the real site.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://www.recktube.xyz
    steps:
      - uses: actions/checkout@v4
      - name: Wait for this commit to be live
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS "$SITE/api/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "live version: ${v:-unknown}"
            if [ "$v" = "$GITHUB_SHA" ]; then echo "Live."; exit 0; fi
            sleep 15
          done
          echo "::error::The live site is not serving $GITHUB_SHA after 15 minutes. Check the Vercel deployment."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Phone-size smoke test on the live site
        run: node scripts/smoke.mjs "$SITE"
